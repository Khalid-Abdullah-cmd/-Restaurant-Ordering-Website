<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Details </title>
<link rel="stylesheet" href="style.css"></head>
<body>

    <header class="site-header">
        <a href="index.html">Our Restaurent</a>
      <a href="Cart.html">🛒 Car (<span id="cart-count">0</span>)</a>
    </header>

    <div class="container">
        <section class="card item-details-card" id="detail-card">
            <div class="image-container">
                <img id="item-image" alt="صورة الوجبة">
            </div>
            <div class="info-container">
                <span class="category-badge" id="item-category"></span>
                <h1 id="item-name"></h1>
                <div class="rating">
                    <span class="star">★</span> <span id="item-rating"></span>
                </div>
                <p class="description" id="item-description"></p>
                <div class="price-action">
                    <div class="price-tag">
                        <span id="item-price"></span>
                    </div>
                    <button id="add-to-cart-btn" class="btn btn-primary"> Add To Car  🛒</button>
                </div>
                <p class="add-message" id="add-message"></p>
            </div>
        </section>

        <p id="not-found" class="empty-cart-msg" style="display: none;">
            sorry, this mael is not available <a href="Cart.html">Returning to the list </a>
        </p>
    </div>

    <script src="js/menu-data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
