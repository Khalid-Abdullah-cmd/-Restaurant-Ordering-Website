{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="checkout-container" style="display: flex; flex-wrap: wrap; gap: 30px; max-width: 1000px; margin: 40px auto; padding: 20px;">
    
    <!-- Left Side: Order Summary -->
    <div class="order-summary" style="flex: 1; min-width: 300px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: var(--shadow);">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">1. Order Summary</h3>
        
        <!-- JavaScript will inject the final uneditable summary here -->
        <div id="checkout-summary-container"></div>
        
        <div class="cart-total" style="font-size: 1.2rem; font-weight: bold; text-align: right; margin-top: 15px; color: var(--primary-color);">
            Total: $<span id="checkout-total-price">0.00</span>
        </div>
    </div>

    <!-- Right Side: Checkout Form -->
    <div class="checkout-form" style="flex: 1; min-width: 300px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: var(--shadow);">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">2. Delivery Details</h3>
        
        <!-- Action must point to 'checkout', matching urls.py -->
        <!-- ID added so JavaScript can intercept the submission -->
        <form id="checkout-form" action="{% url 'checkout' %}" method="POST">
            {% csrf_token %}
            
            <!-- HIDDEN INPUT: JavaScript will place the JSON cart data here right before submission -->
            <input type="hidden" name="cart_data" id="cart_data">
            
            <!-- Field names must match your Order model fields (customer_name, phone, address) -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="customer_name" style="font-weight: bold; display: block; margin-bottom: 5px;">Full Name (Required)</label>
                <input type="text" id="customer_name" name="customer_name" required placeholder="e.g. Jana Farouk">
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="phone" style="font-weight: bold; display: block; margin-bottom: 5px;">Phone Number (Required)</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="address" style="font-weight: bold; display: block; margin-bottom: 5px;">Address or Table Number (Required)</label>
                <textarea id="address" name="address" rows="3" required placeholder="Enter delivery address..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
            </div>

            <!-- Display backend validation errors if any exist -->
            {% if cart_error %}
                <p style="color: red; font-weight: bold;">{{ cart_error }}</p>
            {% endif %}

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Confirm Order & Pay</button>
        </form>
    </div>
</div>
{% endblock content %}
